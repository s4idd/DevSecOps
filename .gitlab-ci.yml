stages:
  - security-static   # Phase 1 : Scan du code source
  - build-test        # Phase 2 : Compilation
  - security-image    # Phase 3 : Scan des images & SBOM
  - package           # Phase 4 : Release finale

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

# =========================================================
# STAGE 1 : SECURITY STATIC
# =========================================================

# FIX GITLEAKS : entrypoint [""] permet d'utiliser le shell GitLab
secrets_scan:
  stage: security-static
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --source . --no-git
  allow_failure: true

# FIX SEMGREP : On force l'analyse du répertoire courant
sast_scan:
  stage: security-static
  image: 
    name: semgrep/semgrep
    entrypoint: [""]
  script:
    - semgrep scan --config auto --error --quiet .
  allow_failure: true

# SCA : Scan des dépendances Python
python_dependency_scan:
  stage: security-static
  image: python:3.11-slim
  script:
    - pip install pip-audit
    - pip-audit -r backend/requirements.txt
  allow_failure: true

# =========================================================
# STAGE 2 : BUILD & TEST
# =========================================================

build_backend:
  stage: build-test
  image: python:3.11-slim
  script:
    - cd backend && pip install -r requirements.txt
    - python3 -m py_compile main.py
    - echo "Backend validé"

build_frontend:
  stage: build-test
  image: node:20-alpine
  script:
    - cd frontend && npm install && npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# =========================================================
# STAGE 3 : SECURITY IMAGE & SBOM
# =========================================================

# SCA IMAGE : On build et on scanne avec Trivy
container_scanning:
  stage: security-image
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE ./backend
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 $BACKEND_IMAGE
  allow_failure: true

# FIX SYFT : Installation dynamique sur Alpine pour avoir un Shell
generate_sbom:
  stage: security-image
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - /usr/local/bin/syft . -o cyclonedx-json > sbom.json
  artifacts:
    paths:
      - sbom.json

# =========================================================
# STAGE 4 : PACKAGE (PRODUCTION)
# =========================================================

release_prod:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE ./backend
    - docker tag $BACKEND_IMAGE $CI_REGISTRY_IMAGE/backend:latest
    - docker push $BACKEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    
    - docker build -t $FRONTEND_IMAGE ./frontend
    - docker tag $FRONTEND_IMAGE $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $FRONTEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/frontend:latest